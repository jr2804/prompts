[tools]
bun = "latest"
npm = "latest"
"npm:saddle-cli" = "latest"

ripgrep = "latest"
"github:peteretelej/tree" = { version = "latest", rename_exe = "tree-cli" }

# Linter/formatter/type checker tools
"ruff" = "latest"
"ty" = "latest"
"rumdl" = "latest"
"pipx:git+https://codeberg.org/jr2804/clean-sort.git" = "latest"


"github:kreuzberg-dev/kreuzberg" = "latest"
"npm:@llamaindex/liteparse" = "latest"
"github:iOfficeAI/OfficeCLI" = "latest"

"github:1broseidon/ketch" = "latest"

[settings.npm]
package_manager = "bun"

[tasks.default]
run = "mise tasks"

[tasks.upgrade-tools]
description = "Upgrade all development tools to their latest versions"
run = ["mise install", "mise up", "mise prune"]

[tasks.env-sync]
description = "Sync the virtual environment with pyproject.toml dependencies"
run = "uv sync -U --dev --all-extras --all-groups"

[tasks.format]
description = "Format source code and markdown files"
run = [
    "csort run ./ --config .config/csort.toml",
    "ruff check --select I --fix", # isort-equivalent sorting of imports
    "ruff format .",
]

[tasks.lint]
description = "Run linter (ruff)"
run = 'ruff check ./ --fix --unsafe-fixes'

[tasks.format-md]
description = "Format Markdown files with rumdl"
run = "rumdl fmt --config .config/rumdl.toml ./"

[tasks.lint-md]
description = "Lint Markdown files with rumdl (no writes)"
run = "rumdl check --config .config/rumdl.toml ./"

[tasks.add-skills]
description = "Add skills to the agent"
run = [
    "cls",
    # coding & tools skills
    "bun x skills add jr2804/prompts -a universal -y -s python-ultimate -s docx -s docx-svg -s docling-document-intelligence -s pdf -s pptx -s xlsx",
    # "bun x skills add AlmogBaku/debug-skill -a universal -y",

    "bun x skills add https://github.com/nicobailon/visual-explainer -a universal -y",
    "bun x skills add https://github.com/hardikpandya/stop-slop -a universal -y",

    # document intelligence skills
    "bun x skills add kreuzberg-dev/kreuzberg -a universal -y",
    "bun x skills add run-llama/llamaparse-agent-skills --skill liteparse -a universal -y",

]

[tasks.add-mcp-servers]
description = "Register MCP servers with AI assistants"
usage = '''
arg "<ai_agent>" help="AI assistant: claude, gemini, copilot, opencode, ... (see https://github.com/neondatabase/add-mcp)"
'''

run = [
	#"clear",
	'bun x add-mcp "ketch mcp serve" -y -a {{usage.ai_agent}} -n ketch',
]
